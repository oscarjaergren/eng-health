# Pinned versions of every CLI tool the repo uses, and the repo's command line (the tasks below).
# Python's version is in .python-version and Rust's in rust-toolchain.toml, which uv, rustup and
# the Dockerfile read too. Python packages, including ruff and mypy, are pinned by uv.lock.
#
# Setup: mise run setup. Updates: `mise outdated`.

[tools]
uv = "0.12.23"                    # Python packages and the virtualenv
prek = "0.5.5"                    # git hook manager
gitleaks = "8.30.1"               # secret scanning
typos = "1.51.1"                  # spelling
editorconfig-checker = "3.11.3"   # whitespace and line endings; 4.x assets are unknown to mise yet
actionlint = "1.7.12"             # GitHub Actions workflows
hadolint = "2.15.1"               # Dockerfile
dprint = "0.60.1"                 # markdown and json formatting
lychee = "0.24.2"                 # link checking (pre-push: network-bound)
committed = "1.1.11"              # conventional commit messages
jq = "1.8.2"                      # reads the agent hook's JSON payload

[settings]
# Fail rather than silently using whatever happens to be on PATH.
lockfile = true
idiomatic_version_file_enable_tools = ["python", "rust"]

# The repo's command line, for people and agents: `mise tasks` lists it, `mise run <task>` runs it.
# CI runs the same tasks, so one that stops working fails CI rather than misleading a reader.

[tasks.setup]
description = "Install the pinned tools, the Python packages and the git hooks"
run = ["mise install", "uv sync --locked", "prek install"]

[tasks.lint]
description = "Run every commit-stage hook on all files, as CI does"
run = "prek run --all-files --show-diff-on-failure"

[tasks.format]
description = "Format the repo, or only the files given"
run = "scripts/format.sh"

[tasks.test]
description = "Run the Python and Rust tests"
run = ["uv run --locked pytest", "cargo test --manifest-path sync/Cargo.toml"]

[tasks.check]
description = "What CI checks: lint, types, clippy and every test"
run = [
  "mise run lint",
  "uv run --locked mypy",
  "cargo clippy --manifest-path sync/Cargo.toml --all-targets -- -D warnings",
  "mise run test",
]

[tasks.dev]
description = "Start the dashboard on http://localhost:8501"
run = "uv run --locked streamlit run dashboard_main.py"

[tasks.sync]
description = "Build the sync engine and sync; extra arguments go to it, e.g. '--only pipelines'"
run = "cargo run --release --manifest-path sync/Cargo.toml -- sync"
