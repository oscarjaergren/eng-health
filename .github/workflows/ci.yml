name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --tb=short --cov=azure_pr_analytics --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Black (Code Formatting)
      run: |
        black --check --diff azure_pr_analytics/ tests/

    - name: Run Flake8 (Linting)
      run: |
        flake8 azure_pr_analytics/ tests/ --max-line-length=88 --extend-ignore=E203,W503

    - name: Run MyPy (Type Checking)
      run: |
        mypy azure_pr_analytics/ --ignore-missing-imports --no-strict-optional

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety bandit

    - name: Run Safety (Dependency Security)
      run: |
        safety check --json --output safety-report.json || true

    - name: Run Bandit (Code Security)
      run: |
        bandit -r azure_pr_analytics/ -f json -o bandit-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, code-quality]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test package imports
      run: |
        python -c "
        from azure_pr_analytics.clients.azure_devops_client import AzureDevOpsClient
        from azure_pr_analytics.clients.github_client import GitHubClient
        from azure_pr_analytics.processors.unified_data_processor import UnifiedDataProcessor
        from azure_pr_analytics.dashboard.dashboard import *
        print('✅ All imports successful!')
        "

    - name: Test CLI entry points
      run: |
        python main.py --help || echo "CLI help test completed"

    - name: Test dashboard startup (dry run)
      run: |
        timeout 30s streamlit run dashboard_main.py --server.headless=true --server.port=8502 || echo "Dashboard startup test completed"

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme

    - name: Generate API documentation
      run: |
        mkdir -p docs/api
        python -c "
        import os
        import pkgutil
        import azure_pr_analytics

        def generate_module_docs(package, path=''):
            for importer, modname, ispkg in pkgutil.iter_modules(package.__path__, package.__name__ + '.'):
                if not ispkg:
                    print(f'Found module: {modname}')

        generate_module_docs(azure_pr_analytics)
        "

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, code-quality, security, integration-test]
    if: always()

    steps:
    - name: Notify Success
      if: ${{ needs.test.result == 'success' && needs.code-quality.result == 'success' && needs.integration-test.result == 'success' }}
      run: |
        echo "🎉 All checks passed! Ready for deployment."

    - name: Notify Failure
      if: ${{ needs.test.result == 'failure' || needs.code-quality.result == 'failure' || needs.integration-test.result == 'failure' }}
      run: |
        echo "❌ Some checks failed. Please review the logs."
        exit 1
