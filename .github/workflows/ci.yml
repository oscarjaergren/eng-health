name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The commit-stage git hooks, so a commit made with --no-verify still can't land.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: uv sync --locked
      - run: uv run --locked mypy
      - run: uv run --locked pytest --cov --cov-report=term-missing --junitxml=test-results/pytest.xml
      # The Pipelines view reads these to find flaky tests, including in this repo.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v7
      # The version, clippy and rustfmt come from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sync
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: sync/Cargo.toml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The exported requirements are fully resolved and hashed, so pip-audit needs no resolver.
      - run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          uv run --locked pip-audit --strict --disable-pip -r "$RUNNER_TEMP/req.txt"
      - run: uv run --locked bandit -r eng_health -ll

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t eng-health .
      - run: docker run --rm eng-health eng-health --version
      - name: Dashboard starts and answers its health check
        run: |
          docker run -d --name app -e MOCK_MODE=true -p 8501:8501 eng-health
          for i in $(seq 30); do
            curl -fs http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
