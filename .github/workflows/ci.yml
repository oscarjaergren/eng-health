name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege; a job that needs more asks for it.
permissions:
  contents: read

# mise verifies each tool's attestations through GitHub's API. Unauthenticated, that shares the
# runner IP's small hourly limit with every other job on it, and installs fail when it runs out.
env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

# A newer push to the same branch makes the running one irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The commit-stage git hooks, so a commit made with --no-verify still can't land.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.9 # the same mise as min_version in .config/mise.toml
      - run: mise run lint
      # A pre-push hook, which `mise run lint` skips; without this, --no-verify could ship it.
      - run: prek run lychee --all-files --hook-stage pre-push
        env:
          GITHUB_TOKEN: ${{ github.token }} # github.com links, past the anonymous rate limit

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.9 # the same mise as min_version in .config/mise.toml
      - run: uv sync --locked
      - run: uv run --locked mypy
      - run: uv run --locked vulture
      - run: uv run --locked deptry .
      - run: uv run --locked pytest --cov --cov-report=term-missing --junitxml=test-results/pytest.xml
      # Reported, not gated: a line a test runs without checking still counts as covered.
      - run: uv run --locked coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      # The Pipelines view reads these to find flaky tests, including in this repo.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: test-results/

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version, clippy and rustfmt come from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sync
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Broken links between doc comments, private items included.
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.9 # the same mise as min_version in .config/mise.toml
          install_args: github:Boshen/cargo-shear github:EmbarkStudios/cargo-deny
      - run: cargo-shear
      - run: cargo-deny check

  # Mutation tests the Rust a PR changes: fails if the tests miss a mutant in it.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff against origin/main
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sync
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.9 # the same mise as min_version in .config/mise.toml
          install_args: github:sourcefrog/cargo-mutants
      # The script, not `mise run mutate`: a task makes mise install every tool in the config.
      - run: scripts/mutate.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.9 # the same mise as min_version in .config/mise.toml
      # The exported requirements are fully resolved and hashed, so pip-audit needs no resolver.
      - run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          uv run --locked pip-audit --strict --disable-pip -r "$RUNNER_TEMP/req.txt"

  # The commit hook only scans staged changes. A secret committed and later deleted still needs
  # rotating, so the whole history is scanned too. .gitleaksignore lists reviewed false positives.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.9 # the same mise as min_version in .config/mise.toml
          install_args: gitleaks
      - run: gitleaks git --redact --no-banner --verbose

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.9 # the same mise as min_version in .config/mise.toml
          install: false # the tasks only need docker
      - run: mise run image
      # Health, non-root user, sync engine, schema.sql, no dev dependencies, size ceiling.
      - run: mise run image-check
