# The dashboard's dependencies; uv.lock pins every version, including transitive ones.
# Not a package: nothing is built or installed from this repo, so there is no build-system.

[project]
name = "eng-health"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.6",
    "plotly>=7.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "debugpy>=1.8",
    "mypy>=2.4",
    "pandas-stubs>=3.0.5.260914",
    "pip-audit>=2.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".windsurf"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]  # en dashes in UI strings are deliberate

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["eng_health"]

[tool.mypy]
python_version = "3.14"
packages = ["eng_health"]
ignore_missing_imports = true
check_untyped_defs = true
