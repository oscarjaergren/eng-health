# The dashboard's dependencies; uv.lock pins every version, including transitive ones.
# Not a package: nothing is built or installed from this repo, so there is no build-system.

[project]
name = "eng-health"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65",
]

[dependency-groups]
dev = [
    "debugpy>=1.8",
    "deptry>=0.25.1",
    "mypy>=2.4",
    "pandas-stubs>=3.0.5.260914",
    "pip-audit>=2.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "ruff>=0.16.10",
    "vulture>=2.16",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# A curated set rather than ALL, which turns style preferences into failures.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF",
    "BLE",  # blind except: catch what you can handle
    "S",    # security (bandit's rules)
    "DTZ",  # naive datetimes
    "ARG",  # unused arguments
    "ERA",  # commented-out code
    "T20",  # print
    "PT", "RET", "PTH", "C4", "PERF",
    "TID251",  # banned imports, below
]
ignore = [
    "RUF001",  # en dashes in UI strings are deliberate
    "S603",    # flags every subprocess call; S602 still catches shell=True
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest checks
    "S608",  # seeding builds INSERTs from fixed column names
]
"eng_health/cli.py" = ["T20"]     # printing is the command line's output
"tests/fake_sync.py" = ["T20"]    # stands in for the engine, which prints JSON events
"eng_health/mock.py" = ["S311"]   # sample data, not secrets
# The dashboard is the only code that draws; metrics stay testable without it.
"eng_health/dashboard/**" = ["TID251"]
"dashboard_main.py" = ["TID251"]
"tests/test_app.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"streamlit".msg = "Only eng_health/dashboard uses Streamlit; keep metrics free of it."
"plotly".msg = "Only eng_health/dashboard draws charts."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
xfail_strict = true
# Warnings are errors, so a pandas or Streamlit deprecation fails here before an upgrade breaks.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["eng_health"]

[tool.mypy]
python_version = "3.14"
files = ["eng_health", "tests", "main.py", "dashboard_main.py"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true  # plotly ships no type information

[tool.vulture]
paths = ["eng_health", "tests", "main.py", "dashboard_main.py"]
# 60 reports unused functions, classes and attributes; higher only finds unused imports.
min_confidence = 60
ignore_names = [
    "updated_at",  # part of the record format shared with sync/; models.py reads it by name
    "clean_env",   # autouse fixture: pytest calls it, nothing names it
]
