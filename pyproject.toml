# Tool configuration only. Dependencies live in requirements*.txt so the
# Docker image can install them in a cached layer.

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".windsurf"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]  # en dashes in UI strings are deliberate

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pr_analytics"]

[tool.mypy]
python_version = "3.14"
packages = ["pr_analytics"]
ignore_missing_imports = true
check_untyped_defs = true
