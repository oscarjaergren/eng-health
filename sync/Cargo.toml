[package]
name = "eng-health"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Syncs pull requests and GitHub Actions runs from Azure DevOps and GitHub into the eng-health database"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
futures = "0.3"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "query", "http2", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dotenvy = "0.15"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
wiremock = "0.6"
pretty_assertions = "1"
tempfile = "3"
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
# Only what lib.rs re-exports may be pub; everything else is pub(crate), so visibility says
# what the surface is.
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Expected failures are returned as errors. A panic is for a broken invariant and says which:
# expect("why this can't fail"), never a bare unwrap. Tests may unwrap (clippy.toml).
unwrap_used = "warn"
# Suppress with #[expect(lint, reason = "...")]: it fails once the lint no longer fires,
# so a stale suppression can't linger.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
