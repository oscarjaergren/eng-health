services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # docker compose run --rm cli sync
  cli:
    build: .
    entrypoint: ["python", "main.py"]
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    profiles: [tools]
